<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="calcContainer">
        <div id="screen">
            <div id="mainDisplay" class="text">0</div>
            <div id="secondDisplay" class="text">0</div>
        </div>

        <div id="buttons">
            <div class="row">
                <div class="gridItem">AC</div>
                <div class="gridItem">C</div>
                <div class="gridItem"><</div>
                <div class="gridItem operator">/</div>
            </div>
            <div class="row">
                <div class="gridItem number">7</div>
                <div class="gridItem number">8</div>
                <div class="gridItem number">9</div>
                <div class="gridItem operator">x</div>
            </div>
            <div class="row">
                <div class="gridItem number">4</div>
                <div class="gridItem number">5</div>
                <div class="gridItem number">6</div>
                <div class="gridItem operator">-</div>
            </div>
            <div class="row">
                <div class="gridItem number">1</div>
                <div class="gridItem number">2</div>
                <div class="gridItem number">3</div>
                <div class="gridItem operator">+</div>
            </div>
            <div id="bottomRow" class="row">
                <div class="gridItem number">0</div>
                <div class="gridItem">.</div>
                <div class="equal">=</div>
            </div>
        </div>

        
    </div>



<script src="script.js"></script>
</body>
</html>
